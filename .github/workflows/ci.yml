name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The whole gate is `just check`: ruff and the finder tests. uv is the only
  # tool installed; it fetches Python, ruff and just itself. tests/all.sh takes
  # its suite count from GATE_JOBS: the Actions VM has 4 vCPUs and every suite
  # is one process, so 4 suites at once.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync

      - name: Gate (check)
        env:
          GATE_JOBS: 4
        run: uvx --from rust-just just check
