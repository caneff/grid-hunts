name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

jobs:
  # A pull request and a push to main run the narrowed gate
  # (`tests/all.sh --changed`); the schedule runs the full `just check` nightly
  # as the backstop. The Pants launcher serves the narrowed run's selection and
  # the edge check (pants.toml, docs/pants.md).
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history: --changed diffs against a base commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync

      - name: Install Pants
        uses: pantsbuild/actions/init-pants@v11
        with:
          gha-cache-key: v0
          named-caches-hash: ${{ hashFiles('pants.toml') }}

      - name: Gate (check)
        env:
          # The Actions VM has 4 vCPUs and every suite is one process.
          GATE_JOBS: 4
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          full() {
            uvx --from rust-just just check; rc=$?
            echo "widened: $1"; return $rc
          }
          case $EVENT in
            pull_request) bash tests/all.sh --changed "origin/$BASE_REF" ;;
            push)
              # An all-zeros BEFORE (a new branch) and a BEFORE a force-push
              # left out of the clone both fail this check.
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                bash tests/all.sh --changed "$BEFORE"
              else full "no base commit $BEFORE in the clone"; fi ;;
            *) uvx --from rust-just just check ;;
          esac
