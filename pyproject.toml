# One Python environment for every finder, test and tool: `uv run <file>`
# syncs it from uv.lock once, and nothing resolves per call.
# Not a package -- the scripts load their neighbours through sys.path.
[project]
name = "grid-hunts"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "ortools",
    "pillow",
    "python-sat",
    "sudoku-kit",
]

[tool.uv]
package = false

[tool.uv.sources]
sudoku-kit = { git = "https://github.com/caneff/sudoku-kit" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
